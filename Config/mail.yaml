# Email notification settings
# Set up your email config,
email_config:
  smtp_server: "smtp.gmail.com"    # For gmail SMTP server
  smtp_port: 587                   # SMTP port
  sender_email: "user@example.com" # An active email address
  sender_password: "REDACTED_GMAIL_APP_PASSWORD" # The App password, if you're using gmail, you can generate one from your gmail account
  default_receiver: "receiver@example.com" # the receiver that aim to notify
message_defaults:
  default_subject: "Automated Report from System"
  default_body: "Please find the attached report."
